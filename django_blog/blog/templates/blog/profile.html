{% extends "blog/base.html" %}
{% block title %}Profile - Django Blog{% endblock %}
{% block content %}
<h1>Your Profile</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset>
        <legend>User Info</legend>
        {{ u_form.as_p }}
    </fieldset>
    <fieldset>
        <legend>Profile Info</legend>
        {{ p_form.as_p }}
    </fieldset>
    <button type="submit">Update</button>
</form>
{% endblock %}
