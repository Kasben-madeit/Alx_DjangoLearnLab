{% extends "base.html" %}
{% block content %}
  <h2>Book List</h2>

  <ul>
    {% for book in books %}
      <li>
        <strong>{{ book.title }}</strong> by {{ book.author }}
        (ISBN: {{ book.isbn }})
        <!-- Optional: links to edit/delete -->
        <a href="{% url 'book_edit' book.pk %}">Edit</a> |
        <a href="{% url 'book_delete' book.pk %}">Delete</a>
      </li>
    {% empty %}
      <li>No books available.</li>
    {% endfor %}
  </ul>

  <p><a href="{% url 'book_create' %}">Add a new book</a></p>
{% endblock %}
